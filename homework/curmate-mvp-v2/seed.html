<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seed ข้อมูลตัวอย่างลง Firestore · Curmate MVP v2</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "IBM Plex Sans Thai", "Noto Sans Thai", sans-serif; background: #F8FAFC; color: #0F172A; }
    .container { max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .subtitle { color: #475569; margin-top: 0; margin-bottom: 24px; }
    .card { background: #fff; border: 1px solid #E2E8F0; border-radius: 10px; padding: 16px; margin-bottom: 12px; }
    .btn { display: inline-block; padding: 8px 16px; border-radius: 8px; border: none; background: #2563EB; color: #fff; font-size: 0.95rem; cursor: pointer; }
    .btn:disabled { background: #94A3B8; cursor: default; }
    .btn-row { margin-bottom: 16px; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js" defer></script>
  <script src="js/firebase-config.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/seed.js" defer></script>
</head>
<body>
  <div class="container">
    <h1>Seed ข้อมูลตัวอย่างลง Firestore (v2)</h1>
    <p class="subtitle">ใช้ Firestore project เดียวกับ homework/curmate-mvp เดิม — หน้านี้ใช้ครั้งเดียวตอนตั้งค่า กดซ้ำได้อย่างปลอดภัย</p>
    <div class="btn-row">
      <button id="ปุ่มเริ่ม" class="btn">เริ่มใส่ข้อมูลตัวอย่าง</button>
    </div>
    <pre id="log" class="card" style="margin-top:16px; white-space:pre-wrap;"></pre>
  </div>
</body>
</html>
